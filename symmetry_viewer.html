const operations = ["E — тождество", "C₃(y) — поворот на 120° вокруг оси y", "C₃²(y) — поворот на 240° вокруг оси y", "C₂′ — поворот на 180° вокруг оси через F(eq₁) и P", "C₂″ — поворот на 180° вокруг оси через F(eq₂) и P", "C₂‴ — поворот на 180° вокруг оси через F(eq₃) и P", "σₕ — отражение в плоскости xz", "σᵥ — отражение в плоскости, проходящей через F(eq₁) и y", "σᵥ′ — отражение в плоскости, проходящей через F(eq₂) и y", "σᵥ″ — отражение в плоскости, проходящей через F(eq₃) и y", "S₃¹ — C₃ + σₕ", "S₃⁵ — C₃² + σₕ"];

const selector = document.getElementById("operation");
const plot = document.getElementById("plot");

// Заполняем выпадающий список
operations.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    selector.appendChild(option);
});

// Отображаем выбранную анимацию
async function showOperation(name) {
    const fig = figures[name];

    await Plotly.newPlot(
        plot,
        fig.data,
        fig.layout,
        {responsive: true}
    );

    if (fig.frames && fig.frames.length) {
        await Plotly.addFrames(plot, fig.frames);
    }
}

selector.addEventListener("change", () => {
    showOperation(selector.value);
});

// Начальное состояние
showOperation(operations[0]);
